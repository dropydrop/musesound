<body class="h-screen w-full flex flex-col overflow-hidden relative">
<!-- Hidden YouTube Player Container -->
<div class="hidden" id="player-container"></div>
<!-- Custom Player Header -->
<header class="flex justify-between items-center p-gutter w-full z-40 bg-transparent shrink-0">
<button aria-label="Collapse player" class="h-12 w-12 flex items-center justify-center text-on-surface hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-3xl">keyboard_arrow_down</span>
</button>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase">Now Playing</span>
<button aria-label="Menu" class="h-12 w-12 flex items-center justify-center text-on-surface hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-3xl">more_vert</span>
</button>
</header>
<!-- Main Player Canvas -->
<main class="flex-1 flex flex-col items-center justify-start px-container-margin-mobile pt-stack-md pb-32 overflow-y-auto">
<!-- Album Art -->
<div class="w-full max-w-sm aspect-square rounded-2xl overflow-hidden shadow-2xl mb-stack-lg relative group">
<div class="absolute inset-0 bg-surface-container-high/20 z-10 transition-opacity opacity-0 group-hover:opacity-100 flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface text-5xl bg-surface/50 rounded-full p-4 backdrop-blur-sm shadow-sm cursor-pointer">fullscreen</span>
</div>
<img alt="Album Cover" class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105" data-alt="A striking abstract digital art piece serving as a music album cover. The composition features smooth, flowing geometric waves glowing in vibrant red and soft peach tones against a deep, infinite charcoal black void. The lighting is ethereal, creating a sense of deep space and modern minimalist aesthetic suitable for an electronic or ambient music release." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD4tvMuFK_Rs0f2xa4Y1cxzoUn2EF3ZEzlY0HFqXo6koBH2QnoS9HkJVzPfa547M_-M1_rpT-KAUHEwKRL85iFuoySqskg8G0HfIFIK7GUlIP83dHzR3OgDPSIZvPSTtJiTXMc9dshQ8Z8nYTCSgCLRdYe39LBqwzdxK4p7nCrkac6uZuqgjyE-ql1bm1Hy3qLMzw-5jlZUiXuzbLSLPY1J5WR9qtlYGSHgEWYpbB6KJ1EQaBClXtHhtrNAwt8Y9kjR5_Dox04jKFM"/>
</div>
<!-- Track Info -->
<div class="w-full max-w-sm flex flex-col items-start mb-stack-lg">
<div class="flex justify-between items-center w-full mb-unit">
<div class="flex flex-col overflow-hidden">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface truncate pr-4">Neon Horizon</h1>
<h2 class="font-title-md text-title-md text-on-surface-variant truncate">Synthwave Collective</h2>
</div>
<button class="h-12 w-12 flex items-center justify-center text-primary shrink-0 hover:scale-110 transition-transform">
<span class="material-symbols-outlined icon-filled text-2xl">favorite</span>
</button>
</div>
</div>
<!-- Progress Bar Area -->
<div class="w-full max-w-sm flex flex-col mb-stack-lg group cursor-pointer">
<div class="h-1.5 w-full bg-surface-variant rounded-full overflow-hidden relative">
<div class="absolute top-0 left-0 h-full w-1/3 bg-primary rounded-full group-hover:bg-primary-fixed transition-colors"></div>
</div>
<div class="flex justify-between items-center mt-2 font-body-sm text-body-sm text-on-surface-variant">
<span>1:24</span>
<span>4:05</span>
</div>
</div>
<!-- Playback Controls -->
<div class="w-full max-w-sm flex items-center justify-between px-4">
<button class="h-12 w-12 flex items-center justify-center text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">shuffle</span>
</button>
<button class="h-16 w-16 flex items-center justify-center text-on-surface hover:text-primary transition-colors" id="prev-btn">
<span class="material-symbols-outlined text-4xl">skip_previous</span>
</button>
<button class="h-20 w-20 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-[0_0_30px_rgba(83,224,118,0.15)] hover:scale-105 active:scale-95 transition-all" id="play-pause-btn">
<span class="material-symbols-outlined icon-filled text-5xl ml-1">play_arrow</span>
</button>
<button class="h-16 w-16 flex items-center justify-center text-on-surface hover:text-primary transition-colors" id="next-btn">
<span class="material-symbols-outlined text-4xl">skip_next</span>
</button>
<button class="h-12 w-12 flex items-center justify-center text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">repeat</span>
</button>
</div>

<button class="flex flex-col items-center justify-center text-secondary hover:text-primary-fixed-dim scale-95 active:scale-90 transition-transform flex-1 h-12">

<span class="font-label-caps text-label-caps">Discover</span>

<button class="flex flex-col items-center justify-center text-secondary hover:text-primary-fixed-dim scale-95 active:scale-90 transition-transform flex-1 h-12">
<span class="material-symbols-outlined text-2xl mb-1">search</span>
<span class="font-label-caps text-label-caps">Search</span>
</button>

<span class="material-symbols-outlined text-2xl mb-1">library_music</span>
<span class="font-label-caps text-label-caps">Library</span>
</button>
<!-- Active Tab Mapping to Intent (Queue/Now Playing conceptually linked in this UI flow) -->
<button class="flex flex-col items-center justify-center text-primary font-bold hover:text-primary-fixed-dim scale-95 active:scale-90 transition-transform flex-1 h-12">
<span class="material-symbols-outlined icon-filled text-2xl mb-1">queue_music</span>
<span class="font-label-caps text-label-caps">Queue</span>
</button>
</nav>

<div class="hidden md:flex fixed left-0 top-0 h-full w-20 bg-surface-container/90 backdrop-blur-xl border-r border-surface-container-high/50 flex-col items-center py-stack-lg gap-8 z-50">
<button class="flex flex-col items-center justify-center text-secondary hover:text-primary-fixed-dim transition-colors h-16 w-16 rounded-xl hover:bg-surface-variant/50">
<span class="material-symbols-outlined text-2xl">explore</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary hover:text-primary-fixed-dim transition-colors h-16 w-16 rounded-xl hover:bg-surface-variant/50">
<span class="material-symbols-outlined text-2xl">search</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary hover:text-primary-fixed-dim transition-colors h-16 w-16 rounded-xl hover:bg-surface-variant/50">
<span class="material-symbols-outlined text-2xl">library_music</span>
</button>
<button class="flex flex-col items-center justify-center text-primary font-bold transition-colors h-16 w-16 rounded-xl bg-primary/10">
<span class="material-symbols-outlined icon-filled text-2xl">queue_music</span>
</button>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const playIcon = playPauseBtn.querySelector('.material-symbols-outlined');

        let isPlaying = true; // Initial state based on UI showing play icon but track playing visually

        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
            playIcon.classList.toggle('ml-1', isPlaying === false); // Adjust padding for play icon
            // SoundSync interaction hook:
            // if (window.SoundSync && window.SoundSync.player) {
            //     window.SoundSync.player.togglePlay();
            // }
        });

        prevBtn.addEventListener('click', () => {
            console.log('Previous track clicked');
            // SoundSync interaction hook:
            // if (window.SoundSync && window.SoundSync.player) {
            //     window.SoundSync.player.previousTrack();
            // }
        });

        nextBtn.addEventListener('click', () => {
            console.log('Next track clicked');
            // SoundSync interaction hook:
            // if (window.SoundSync && window.SoundSync.player) {
            //     window.SoundSync.player.nextTrack();
            // }
        });

</script>
