<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>MuseSound - high-fidelity audio player for YouTube</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#53e076",
                        "background": "#121414",
                        "surface": "#121414",
                        "surface-container": "#1e2020",
                        "surface-container-high": "#282a2b",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#bccbb9",
                        "outline-variant": "#3d4a3d",
                    },
                    "fontFamily": {
                        "body-md": ["Geist"],
                        "headline-md": ["Geist"],
                        "mono-label": ["Geist Mono"]
                    }
                }
            }
        }
    </script>
    <style>
        .glow-effect { box-shadow: 0 0 20px 0 rgba(83, 224, 118, 0.1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Volume Slider Customization */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #53e076;
            cursor: pointer;
            margin-top: -4px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #3d4a3d;
            border-radius: 2px;
        }

        /* Cinema Mode Styles */
        body.is-cinema-mode #main-header,
        body.is-cinema-mode #playlist-container {
            display: none;
        }

        body.is-cinema-mode footer {
            position: fixed;
            inset: 0;
            height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #1e2020 0%, #121414 100%);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: none;
            z-index: 50;
            gap: 2rem;
            padding: 2rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (min-width: 768px) {
            body.is-cinema-mode footer { gap: 4rem; }
        }

        body.is-cinema-mode footer > div:first-child {
            flex-direction: column;
            width: auto;
            text-align: center;
            gap: 1.5rem;
        }

        body.is-cinema-mode footer .current-art {
            width: 160px;
            height: 160px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            display: block !important;
        }

        @media (min-width: 768px) {
            body.is-cinema-mode footer .current-art {
                width: 280px;
                height: 280px;
            }
        }

        body.is-cinema-mode footer .current-title {
            font-size: 1.25rem;
            line-height: 1.2;
            max-width: 90vw;
        }

        @media (min-width: 768px) {
            body.is-cinema-mode footer .current-title {
                font-size: 2.25rem;
                max-width: 70vw;
            }
        }

        body.is-cinema-mode footer .current-artist {
            font-size: 1rem;
            opacity: 0.7;
        }

        @media (min-width: 768px) {
            body.is-cinema-mode footer .current-artist {
                font-size: 1.5rem;
            }
        }

        body.is-cinema-mode footer .hidden.sm\:block {
            display: block !important;
        }

        body.is-cinema-mode footer > div:nth-child(2) {
            max-width: 800px;
            width: 95%;
            gap: 2rem;
        }

        body.is-cinema-mode #play-pause-btn {
            width: 70px;
            height: 70px;
        }

        @media (min-width: 768px) {
            body.is-cinema-mode #play-pause-btn {
                width: 90px;
                height: 90px;
            }
        }

        body.is-cinema-mode #play-pause-btn span {
            font-size: 2.5rem;
        }

        @media (min-width: 768px) {
            body.is-cinema-mode #play-pause-btn span {
                font-size: 3.5rem;
            }
        }

        body.is-cinema-mode #prev-btn span, 
        body.is-cinema-mode #next-btn span {
            font-size: 2.5rem;
        }

        @media (min-width: 768px) {
            body.is-cinema-mode #prev-btn span, 
            body.is-cinema-mode #next-btn span {
                font-size: 3rem;
            }
        }

        body.is-cinema-mode footer > div:last-child {
            position: relative;
            bottom: auto;
            right: auto;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        body.is-cinema-mode #volume-slider {
            width: 200px;
        }

        /* Resume Banner */
        #resume-banner {
            transition: all 0.5s ease;
            transform: translateY(-100%);
        }
        #resume-banner.visible {
            transform: translateY(0);
        }

        /* Landscape Mobile Optimization */
        @media (max-height: 500px) and (orientation: landscape) {
            body.is-cinema-mode footer {
                flex-direction: row;
                gap: 2rem;
                padding: 1rem;
            }
            body.is-cinema-mode footer .current-art {
                width: 120px;
                height: 120px;
            }
            body.is-cinema-mode footer > div:first-child {
                flex-direction: row;
                text-align: left;
                gap: 1rem;
            }
            body.is-cinema-mode footer .current-title {
                font-size: 1rem;
            }
            body.is-cinema-mode footer > div:nth-child(2) {
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md h-[100dvh] w-screen overflow-hidden flex flex-col">

    <!-- Resume Banner -->
    <div id="resume-banner" class="fixed top-0 left-0 right-0 z-[100] bg-surface-container-high border-b border-primary/30 p-3 flex items-center justify-between hidden">
        <div class="flex items-center gap-3 px-4">
            <span class="material-symbols-outlined text-primary">history</span>
            <div class="text-sm">
                <span class="text-on-surface-variant">Reprendre la lecture de :</span>
                <span id="resume-track-title" class="font-bold ml-1">...</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="btn-resume-ignore" class="px-3 py-1 text-xs text-on-surface-variant hover:text-on-surface transition-colors">Ignorer</button>
            <button id="btn-resume-play" class="bg-primary text-background px-4 py-1.5 rounded-full text-xs font-bold hover:scale-105 transition-transform">Reprendre</button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden relative transition-all duration-500" id="main-content">
        <!-- Header -->
        <header id="main-header" class="p-4 md:p-6 border-b border-outline-variant flex flex-col md:flex-row justify-between items-start md:items-center bg-background/80 backdrop-blur-md z-10 gap-4 transition-all duration-300">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">play_circle</span>
                <h1 class="font-headline-md text-2xl font-bold text-primary">MuseSound</h1>
                <div class="text-sm text-on-surface-variant ml-4 hidden md:block">
                    <span id="track-count">0</span> tracks
                    <span id="total-duration" class="text-on-surface-variant/70 ml-2"></span>
                </div>
            </div>

            <!-- Import Section (Moved to Header) -->
            <div class="flex items-center gap-2 w-full md:w-auto">
                <input id="playlist-url" type="text" placeholder="URL ou Mot-clé..." class="w-full md:w-64 bg-surface-container border-outline-variant rounded-lg px-4 py-2 text-sm focus:ring-1 focus:ring-primary outline-none">
                <button id="btn-import" class="bg-primary text-background font-bold py-2 px-4 rounded-lg hover:opacity-90 transition-opacity whitespace-nowrap">Écouter</button>
            </div>
        </header>

        <!-- View Tabs -->
        <div class="flex border-b border-outline-variant px-4 bg-background/50">
            <button id="tab-playlist" class="px-6 py-3 text-sm font-bold border-b-2 border-primary text-primary transition-all">Playlist</button>
            <button id="tab-queue" class="px-6 py-3 text-sm font-bold border-b-2 border-transparent text-on-surface-variant hover:text-on-surface transition-all flex items-center gap-2">
                File d'attente
                <span id="queue-badge" class="hidden bg-primary text-background text-[10px] px-1.5 py-0.5 rounded-full min-w-[1.2rem] text-center">0</span>
            </button>
        </div>

        <!-- Playlist Items -->
        <div id="playlist-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-1 hide-scrollbar transition-all duration-300">
            <div class="flex flex-col items-center justify-center h-full text-on-surface-variant opacity-50">
                <span class="material-symbols-outlined text-6xl mb-4">queue_music</span>
                <p>No playlist imported yet.</p>
            </div>
        </div>

        <!-- Queue Items (Hidden by default) -->
        <div id="queue-view" class="hidden flex-1 overflow-y-auto p-4 flex flex-col gap-1 hide-scrollbar transition-all duration-300">
            <div class="flex justify-between items-center mb-4 px-2">
                <h3 class="font-bold text-primary flex items-center gap-2">
                    <span class="material-symbols-outlined">queue_play_next</span>
                    Ma File d'attente
                </h3>
                <button id="clear-queue-btn" class="text-xs text-on-surface-variant hover:text-red-400 transition-colors flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">delete_sweep</span>
                    Tout vider
                </button>
            </div>
            <div id="queue-list" class="flex flex-col gap-1">
                <!-- Queue items will be rendered here -->
            </div>
        </div>

        <!-- Toast Container -->
        <div id="toast-container" class="fixed bottom-28 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>
    </main>

    <!-- Player Controls (Footer) -->
    <footer class="min-h-[96px] md:h-24 bg-surface-container border-t border-outline-variant px-4 md:px-6 flex items-center justify-between z-20 shrink-0">
        <!-- Info -->
        <div class="flex items-center gap-4 w-1/4 md:w-1/3">
            <img class="w-12 h-12 rounded object-cover current-art bg-surface-container-high" src="" onerror="this.style.display='none'">
            <div class="hidden sm:block min-w-0">
                <div class="font-bold truncate current-title text-sm">No track</div>
                <div class="text-xs text-on-surface-variant truncate current-artist">-</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex flex-col items-center gap-2 flex-1 max-w-2xl">
            <div class="flex items-center gap-4 md:gap-6">
                <button id="shuffle-btn" class="text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined text-xl md:text-2xl">shuffle</span></button>
                <button id="prev-btn" class="text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined text-2xl md:text-3xl">skip_previous</span></button>
                <button id="play-pause-btn" class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-primary text-background flex items-center justify-center hover:scale-105 transition-transform"><span class="material-symbols-outlined text-2xl md:text-3xl">play_arrow</span></button>
                <button id="next-btn" class="text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined text-2xl md:text-3xl">skip_next</span></button>
                <button id="repeat-btn" class="text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined text-xl md:text-2xl" id="repeat-icon">repeat</span></button>
            </div>
            <!-- Progress (Clickable) -->
            <div class="w-full flex items-center gap-2">
                <span class="text-[10px] font-mono-label w-8 text-right player-current-time">0:00</span>
                <div id="progress-container" class="flex-1 h-2 bg-surface-container-high rounded-full overflow-hidden cursor-pointer relative flex items-center group">
                    <!-- Added group-hover height expansion for better usability -->
                    <div class="player-progress-bar absolute left-0 top-0 bottom-0 bg-primary w-0 pointer-events-none transition-all"></div>
                </div>
                <span class="text-[10px] font-mono-label w-8 player-duration">0:00</span>
            </div>
        </div>

        <!-- Volume/Utils -->
        <div class="flex items-center justify-end gap-2 md:gap-4 w-1/4 md:w-1/3 text-on-surface-variant">
            <button id="eco-btn" class="flex items-center gap-1 text-xs hover:text-primary transition-colors px-2 py-1 rounded border border-outline-variant mr-2">
                <span class="material-symbols-outlined text-sm">speed</span>
                <span class="hidden lg:inline">Eco Data</span>
            </button>
            <!-- Volume Slider -->
            <div class="hidden sm:flex items-center gap-3 w-40 group transition-all duration-300 hover:text-on-surface">
                <span id="volume-icon" class="material-symbols-outlined cursor-pointer text-xl hover:scale-110 transition-transform">volume_up</span>
                <input type="range" id="volume-slider" min="0" max="100" value="100" class="w-full cursor-pointer">
            </div>
            <span id="fullscreen-btn" class="material-symbols-outlined cursor-pointer hover:text-on-surface text-xl ml-4 z-50">open_in_full</span>
        </div>
    </footer>

    <!-- YouTube IFrame Player (Invisible) -->
    <div id="yt-player-fallback" style="width: 0 !important; height: 0 !important; position: absolute; left: -9999px; opacity: 0; pointer-events: none;"></div>

    <script src="js/app.js?v=%%CACHE_BUST%%"></script>
</body>
</html>
